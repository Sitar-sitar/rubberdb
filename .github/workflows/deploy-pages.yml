name: Deploy RubberDB to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build RubberDB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      # 新規アドバイザリで公開が止まらないよう、デプロイ経路では警告扱いにする。
      # ブロックする検査は `RubberDB CI` ワークフローが担当する。
      - name: Audit dependencies (warning only)
        continue-on-error: true
        run: pnpm audit --audit-level high --prod

      - name: Build
        run: pnpm exec vite build --base /rubberdb/

      - name: Validate build artifact
        run: node scripts/verify-build-artifact.mjs dist/public --base /rubberdb/

      - name: SPA fallback for GitHub Pages
        run: cp dist/public/index.html dist/public/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
